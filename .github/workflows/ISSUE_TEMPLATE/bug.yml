name: Bug
description: Something isn't working
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend, Database & Auth, DevOps]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a courier
        2. Accept an order
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or screenshots
      description: Browser console, backend logs or a screenshot
