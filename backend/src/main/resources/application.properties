spring.application.name=backend

# Load the local .env file from the backend working directory
spring.config.import=optional:file:./.env[.properties]

# Read database connection values from configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Prevent Hibernate from changing the existing schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Keep migrations disabled until the existing schema is reviewed
spring.flyway.enabled=false
